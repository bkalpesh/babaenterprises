    <script>
      (function() {
        // Immediate early global error interceptor
        function isExtensionError(msg, src, stack) {
          var str = ((msg || '') + ' ' + (src || '') + ' ' + (stack || '')).toLowerCase();
          return str.includes('metamask') ||
                 str.includes('ethereum') ||
                 str.includes('chrome-extension://') ||
                 str.includes('moz-extension://') ||
                 str.includes('inpage.js');
        }

        window.addEventListener('error', function(e) {
          if (isExtensionError(e.message, e.filename, e.error && e.error.stack)) {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason;
          var msg = (reason && (reason.message || (typeof reason === 'string' ? reason : ''))) || '';
          var stack = (reason && reason.stack) || '';
          if (isExtensionError(msg, '', stack)) {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
          }
        }, true);

        // Define a non-intrusive dummy ethereum provider if none exists or if an extension attempts auto-connect
        try {
          if (!window.ethereum) {
            var noopPromise = function() { return new Promise(function() {}); };
            window.ethereum = {
              isMetaMask: false,
              request: noopPromise,
              send: noopPromise,
              sendAsync: noopPromise,
              enable: noopPromise,
              on: function() {},
              removeListener: function() {},
              autoRefreshOnNetworkChange: false
            };
          }
        } catch (_) {}
      })();
    </script>
